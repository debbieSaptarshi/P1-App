kind = "mobile"
previewPath = "/"
title = "Adaptive Food Coach"
description = "A culturally flexible nutrition and metabolic-health coaching app for people using or coming off GLP-1 medication, focused on practical next-meal guidance, muscle preservation, symptom support, and sustainable progress without obsessive calorie tracking."
version = "1.0.0"
id = "artifacts/adaptive-food-coach"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22069

[services.development]
run = "pnpm --filter @workspace/adaptive-food-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adaptive-food-coach", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/adaptive-food-coach", "run", "serve" ]

[services.env]
PORT = "22069"
BASE_PATH = "/"
